<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU MBG</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-subtle: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding: 40px 15px; }

        .wrapper { max-width: 800px; margin: 0 auto; }

        /* Card Elements */
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 35px; box-shadow: var(--shadow-subtle);
            margin-bottom: 25px; position: relative;
        }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .card-header h2 { font-size: 17px; font-weight: 700; color: var(--text-main); }

        /* Logo Lokal Preview Wrapper */
        .upload-logo-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .upload-logo-container img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background: #fff;
        }

        /* Live Date Badge */
        .live-date-badge {
            text-align: center;
            margin-bottom: 20px;
        }
        .live-date-badge span {
            background: #e0e7ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.1);
        }

        /* Form Controls */
        .form-group { margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 8px; }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md);
            font-size: 14px; color: var(--text-main); background: #fff; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        textarea { height: 260px; font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical; }

        /* Upload Area */
        .upload-dropbox {
            border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 30px;
            text-align: center; background: #fafafa; cursor: pointer; transition: all 0.2s;
        }
        .upload-dropbox:hover { background: #f8fafc; border-color: var(--primary); }
        .upload-dropbox i { font-size: 32px; color: var(--text-muted); margin-bottom: 10px; }
        .upload-dropbox p { font-size: 13px; color: var(--text-muted); }
        input[type="file"] { display: none; }

        /* Buttons */
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: var(--radius-md); font-size: 14px;
            font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; color: white;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }

        .btn-admin-access {
            background: #f1f5f9; border: 1px solid var(--border); color: var(--text-main);
            padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease;
        }
        .btn-admin-access:hover { background: #e2e8f0; border-color: #cbd5e1; }

        /* Status text */
        .status { font-size: 13px; font-weight: 500; margin-top: 15px; display: flex; align-items: center; gap: 8px; }

        /* Image Preview Box inside Admin */
        .preview-container {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: #f8fafc;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            object-fit: contain;
        }
        .preview-container p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Modal Overlay */
        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box { background: white; width: 100%; max-width: 420px; border-radius: var(--radius-lg); padding: 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .modal-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

        .admin-badge {
            background: #d1fae5; color: #065f46; font-size: 12px; font-weight: 600;
            padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px;
        }

        .flex-row { display: flex; gap: 10px; }
        .hidden { display: none !important; }
        code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #0284c7; font-size: 12px; }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- FITUR UTAMA (PUBLIK): UPLOAD FOTO & NAMA FILE OTOMATIS LOWERCASE + FORMAT .JPG (CEGAH TIMPA) -->
    <div class="card" id="publicUploadCard">
        <!-- LOGO LOKAL DI ATAS HALAMAN UPLOAD -->
        <div class="upload-logo-container">
            <img src="logo.png" alt="Logo Instansi" onerror="this.src='https://via.placeholder.com/80?text=LOGO'">
        </div>

        <!-- HARI & TANGGAL LIVE -->
        <div class="live-date-badge">
            <span id="liveDateText"><i class="fa-solid fa-calendar-days"></i> </span>
        </div>

        <div class="card-header" style="justify-content: center; border-bottom: none; margin-bottom: 15px;">
            <h2 style="text-align: center;">SPPG KOTA SERANG SERANG SERANG 2</h2>
        </div>
        
        <div class="form-group">
            <label for="filePathFile">UPLOAD MENU HARI INI:</label>
            <input type="text" id="filePathFile" readonly style="background: #f1f5f9; font-weight: 600; color: var(--primary);" placeholder="Nama file otomatis">
            <!-- DIPERBAIKI: Tag small yang sebelumnya menggantung kini sudah ditutup -->
            <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">Nama file akan disesuaikan secara otomatis berdasarkan tanggal sistem.</small>
        </div>

        <div class="form-group">
            <label>Pilih Berkas:</label>
            <div class="upload-dropbox" onclick="document.getElementById('fileInput').click()">
                <i class="fa-regular fa-folder-open"></i>
                <p id="fileLabelText"><b>UNGGAH FOTO MENU</b></p>
                <input type="file" id="fileInput" onchange="handleFileSelection(this)">
            </div>
        </div>

        <button class="btn btn-success" onclick="uploadFileToGitHub()">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload File Sekarang
        </button>
        <div id="statusFile" class="status"></div>
    </div>

    <!-- PANEL ADMIN: LIHAT FILE, EDIT, PRATINJAU GAMBAR, & HAPUS FILE -->
    <div id="adminPanel" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Mode Administrator Aktif</span>
            <button class="btn-admin-access" style="color: #dc2626; border-color: #fecaca;" onclick="logoutAdmin()">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar Admin
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-code"></i>
                <h2>file anda</h2>
            </div>

            <!-- PILIH FILE DARI REPO OTOMATIS -->
            <div class="form-group">
                <label for="repoFileSelect">Pilih File Langsung dari Repository:</label>
                <div class="flex-row">
                    <select id="repoFileSelect" onchange="onFileSelectedFromDropdown()">
                        <option value="">-- Tunggu Update--</option>
                    </select>
                    <button class="btn btn-primary" style="width: 140px;" onclick="loadGitHubFileList()">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="filePathCode">Atau Ketik Path Manual (Contoh: <code>index.html</code>, <code>assets/foto.jpg</code>):</label>
                <div class="flex-row">
                    <input type="text" id="filePathCode" placeholder="folder/nama-file.html">
                    <button class="btn btn-primary" style="width: 130px;" onclick="loadExistingCode()">Muat File</button>
                </div>
            </div>

            <!-- PRATINJAU GAMBAR -->
            <div id="imagePreviewBox" class="preview-container hidden">
                <p><i class="fa-regular fa-image"></i> Pratinjau Gambar di Repository:</p>
                <img id="adminImagePreview" src="" alt="Pratinjau Gambar">
            </div>

            <!-- KODE TEXTAREA -->
            <div class="form-group" id="codeEditorGroup" style="margin-top: 15px;">
                <label for="codeContent">Isi Kode / Teks File:</label>
                <textarea id="codeContent" placeholder="Isi file akan muncul di sini..."></textarea>
            </div>

            <!-- TOMBOL AKSI ADMIN (SIMPAN & HAPUS) -->
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-primary" id="saveCodeBtn" onclick="updateCodeToGitHub()" style="flex: 1;">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
                </button>
                <button class="btn btn-danger" id="deleteFileBtn" onclick="deleteFileFromGitHub()" style="flex: 1;">
                    <i class="fa-solid fa-trash-can"></i> Hapus File Ini
                </button>
            </div>

            <div id="statusCode" class="status"></div>
        </div>
    </div>

    <!-- TOMBOL AKSES PANEL ADMIN DI BAGIAN PALING BAWAH -->
    <div style="text-align: center; margin-top: 25px; margin-bottom: 0;">
        <button class="btn-admin-access" onclick="openLoginModal()">
            <i class="fa-solid fa-lock" id="lockIcon"></i> <span id="adminBtnText">Admin</span>
        </button>
    </div>

</div>

<!-- MODAL LOGIN ADMIN -->
<div id="loginModal" class="modal-bg hidden">
    <div class="modal-box">
        <h3>Akses Admin</h3>
        
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="adminUser" placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="adminPass" placeholder="Masukkan sandi">
        </div>

        <button class="btn btn-primary" onclick="processLogin()">Masuk</button>
        <button class="btn btn-danger" style="margin-top: 10px;" onclick="closeLoginModal()">Batal</button>
        <p id="loginStatus" class="status" style="color: #dc2626; margin-top: 12px;"></p>
    </div>
</div>

<script>
    // --- KONFIGURASI GITHUB ANDA ---
    const GITHUB_USERNAME = 'SPPGkotaserang2';
    const GITHUB_REPO = 'menumbg';
    const GITHUB_BRANCH = 'main'; 
    const GITHUB_TOKEN = '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';
    // --------------------------------

    // Kredensial Admin
    const ADMIN_USER = 'Serang';
    const ADMIN_PASS = 'Mandiri02srg';

    function openLoginModal() {
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            toggleAdminMode(true);
            return;
        }
        document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('loginStatus').innerText = '';
    }

    function processLogin() {
        const u = document.getElementById('adminUser').value.trim();
        const p = document.getElementById('adminPass').value.trim();
        const statusEl = document.getElementById('loginStatus');

        if (u === ADMIN_USER && p === ADMIN_PASS) {
            localStorage.setItem('isAdminLoggedIn', 'true');
            closeLoginModal();
            toggleAdminMode(true);
        } else {
            statusEl.innerText = 'Username atau sandi yang Anda masukkan salah!';
        }
    }

    function logoutAdmin() {
        localStorage.removeItem('isAdminLoggedIn');
        toggleAdminMode(false);
    }

    function toggleAdminMode(isActive) {
        const adminPanel = document.getElementById('adminPanel');
        const lockIcon = document.getElementById('lockIcon');
        const adminBtnText = document.getElementById('adminBtnText');

        if (isActive) {
            adminPanel.classList.remove('hidden');
            lockIcon.className = "fa-solid fa-shield-halved";
            adminBtnText.innerText = "Panel Admin Aktif";
            loadGitHubFileList();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else {
            adminPanel.classList.add('hidden');
            lockIcon.className = "fa-solid fa-lock";
            adminBtnText.innerText = "Panel Admin";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    window.onload = function() {
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            toggleAdminMode(true);
        }
        displayLiveDate();
    };

    // ==========================================
    // MENAMPILKAN HARI & TANGGAL LIVE
    // ==========================================
    function displayLiveDate() {
        const liveDateText = document.getElementById('liveDateText');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const now = new Date();
        const formattedDate = now.toLocaleDateString('id-ID', options);
        liveDateText.innerHTML = `<i class="fa-solid fa-calendar-days"></i> ${formattedDate}`;
    }

    // ==========================================
    // GENERATE NAMA FILE OTOMATIS (LOWERCASE & .JPG)
    // ==========================================
    function handleFileSelection(input) {
        const labelText = document.getElementById('fileLabelText');
        const filePathInput = document.getElementById('filePathFile');

        if (input.files.length > 0) {
            const file = input.files[0];
            labelText.innerHTML = `File terpilih: <b style="color:var(--success)">${file.name}</b>`;

            // Dapatkan tanggal hari ini
            const now = new Date();
            const months = ["jan", "feb", "mar", "apr", "mei", "jun", "jul", "agu", "sep", "okt", "nov", "des"];
            const monthName = months[now.getMonth()];
            const day = now.getDate();

            // Format otomatis: Huruf kecil semua, dan ekstensi dipaksa menjadi .jpg
            const autoFileName = `${monthName}${day}.jpg`;
            filePathInput.value = autoFileName;
        }
    }

    // ==========================================
    // AMBIL DAFTAR FILE DARI GITHUB REPO
    // ==========================================
    async function loadGitHubFileList() {
        const selectEl = document.getElementById('repoFileSelect');
        selectEl.innerHTML = '<option value="">Sedang memindai file di GitHub...</option>';

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

        try {
            const response = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                selectEl.innerHTML = '<option value="">-- Pilih file dari daftar di bawah --</option>';
                
                const files = data.tree.filter(item => item.type === 'blob');

                if (files.length === 0) {
                    selectEl.innerHTML = '<option value="">Repository kosong</option>';
                    return;
                }

                files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file.path;
                    opt.textContent = file.path;
                    selectEl.appendChild(opt);
                });
            } else {
                selectEl.innerHTML = '<option value="">Gagal memuat daftar file</option>';
            }
        } catch (error) {
            selectEl.innerHTML = '<option value="">Terjadi kesalahan koneksi</option>';
        }
    }

    function onFileSelectedFromDropdown() {
        const selectEl = document.getElementById('repoFileSelect');
        const pathInput = document.getElementById('filePathCode');
        if (selectEl.value) {
            pathInput.value = selectEl.value;
            loadExistingCode();
        }
    }

    // ==========================================
    // UPLOAD FOTO / FILE KE GITHUB (CEGAH TIMPA & CEK NAMA SAMA)
    // ==========================================
    async function uploadFileToGitHub() {
        const fileInput = document.getElementById('fileInput');
        const filePath = document.getElementById('filePathFile').value.trim();
        const statusEl = document.getElementById('statusFile');

        if (fileInput.files.length === 0 || !filePath) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Silakan pilih berkas foto terlebih dahulu!';
            return;
        }

        statusEl.style.color = '#4f46e5';
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa ketersediaan file';

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

        // Cek apakah file dengan nama tersebut sudah ada di GitHub
        try {
            const checkRes = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (checkRes.ok) {
                // File sudah ada di repository! Tampilkan peringatan
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Peringatan: File dengan nama <b>${filePath}</b> sudah ada di dalam repository! File tidak boleh ditimpa.`;
                return;
            }
        } catch (e) {
            // Jika error/file belum ada (404), lanjutkan proses upload di bawah
        }

        const file = fileInput.files[0];
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Membaca file...';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
            const base64Content = reader.result.split(',')[1];
            sendDataToGitHubNewOnly(filePath, base64Content, statusEl, `Upload file otomatis ${filePath} via Web UI`);
        };
        reader.onerror = function (error) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = 'Gagal membaca file: ' + error;
        };
    }

    // ==========================================
    // MUAT KODE / GAMBAR DARI GITHUB (ADMIN)
    // ==========================================
    async function loadExistingCode() {
        const filePath = document.getElementById('filePathCode').value.trim();
        const statusEl = document.getElementById('statusCode');
        const codeContentEl = document.getElementById('codeContent');
        const imagePreviewBox = document.getElementById('imagePreviewBox');
        const adminImagePreview = document.getElementById('adminImagePreview');
        const codeEditorGroup = document.getElementById('codeEditorGroup');

        if (!filePath) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Path file tidak boleh kosong!';
            return;
        }

        const isImage = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(filePath);

        statusEl.style.color = '#4f46e5';
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil data';

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

        try {
            const response = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                
                if (isImage) {
                    imagePreviewBox.classList.remove('hidden');
                    adminImagePreview.src = data.download_url;
                    codeEditorGroup.classList.add('hidden');
                } else {
                    imagePreviewBox.classList.add('hidden');
                    codeEditorGroup.classList.remove('hidden');
                    
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    codeContentEl.value = decodedContent;
                }

                statusEl.style.color = '#10b981';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> File berhasil dimuat!';
            } else {
                statusEl.style.color = '#f59e0b';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-info"></i> File belum ada.';
                imagePreviewBox.classList.add('hidden');
                codeEditorGroup.classList.remove('hidden');
            }
        } catch (error) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = 'Error: ' + error.message;
        }
    }

    // ==========================================
    // UPDATE / SIMPAN KODE KE GITHUB (ADMIN)
    // ==========================================
    function updateCodeToGitHub() {
        const filePath = document.getElementById('filePathCode').value.trim();
        const codeContent = document.getElementById('codeContent').value;
        const statusEl = document.getElementById('statusCode');

        if (!filePath || !codeContent) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Path dan isi kode tidak boleh kosong!';
            return;
        }

        if (filePath.endsWith('.json')) {
            try {
                JSON.parse(codeContent);
            } catch (e) {
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Format JSON tidak valid!';
                return;
            }
        }

        statusEl.style.color = '#4f46e5';
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengonversi data...';

        const base64Content = btoa(unescape(encodeURIComponent(codeContent)));
        sendDataToGitHubWithSha(filePath, base64Content, statusEl, `Update kode ${filePath} via Admin Panel`, true);
    }

    // ==========================================
    // HAPUS FILE DARI GITHUB (ADMIN)
    // ==========================================
    async function deleteFileFromGitHub() {
        const filePath = document.getElementById('filePathCode').value.trim();
        const statusEl = document.getElementById('statusCode');

        if (!filePath) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Pilih atau ketik path file yang ingin dihapus!';
            return;
        }

        if (!confirm(`Apakah Anda yakin ingin menghapus file "${filePath}" secara permanen dari GitHub?`)) {
            return;
        }

        statusEl.style.color = '#4f46e5';
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa file di GitHub...';

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

        try {
            const getRes = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!getRes.ok) {
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> File tidak ditemukan';
                return;
            }

            const fileData = await getRes.json();
            const sha = fileData.sha;

            statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus file...';

            const deleteRes = await fetch(apiUrl, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Hapus file ${filePath} via Admin Panel`,
                    sha: sha,
                    branch: GITHUB_BRANCH
                })
            });

            if (deleteRes.ok) {
                statusEl.style.color = '#10b981';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> File berhasil dihapus dari GitHub!';
                
                document.getElementById('filePathCode').value = '';
                document.getElementById('codeContent').value = '';
                document.getElementById('imagePreviewBox').classList.add('hidden');
                document.getElementById('codeEditorGroup').classList.remove('hidden');
                
                loadGitHubFileList();
            } else {
                const errResult = await deleteRes.json();
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = 'Gagal menghapus: ' + (errResult.message || 'Kesalahan sistem');
            }
        } catch (error) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = 'Error koneksi: ' + error.message;
        }
    }

    // ==========================================
    // FUNGSI PENDUKUNG: UPLOAD FILE BARU
    // ==========================================
    async function sendDataToGitHubNewOnly(filePath, base64Content, statusEl, commitMessage) {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;
        
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim file baru ke Sistem';

        try {
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: base64Content,
                    branch: GITHUB_BRANCH
                })
            });

            const result = await response.json();

            if (response.ok) {
                statusEl.style.color = '#10b981';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Berhasil! File sukses di-upload ke Sistem.';
                loadGitHubFileList();
            } else {
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Gagal: ' + (result.message || 'File sudah ada atau terjadi kesalahan sistem');
            }
        } catch (error) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Error koneksi: ' + error.message;
        }
    }

    // ==========================================
    // FUNGSI PENDUKUNG: UPDATE FILE DENGAN SHA (ADMIN)
    // ==========================================
    async function sendDataToGitHubWithSha(filePath, base64Content, statusEl, commitMessage, isAdmin) {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;
        
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengecek status file lama...';
        let sha = null;

        try {
            const getRes = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha; 
            }
        } catch (e) {
            // File baru
        }

        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan perubahan ke Sistem...';

        try {
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: base64Content,
                    branch: GITHUB_BRANCH,
                    ...(sha && { sha: sha })
                })
            });

            const result = await response.json();

            if (response.ok) {
                statusEl.style.color = '#10b981';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Berhasil! File sukses diperbarui di Sistem.';
                if (isAdmin) {
                    loadExistingCode();
                }
                loadGitHubFileList();
            } else {
                statusEl.style.color = '#dc2626';
                statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Gagal: ' + (result.message || 'Kesalahan sistem');
            }
        } catch (error) {
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Error koneksi: ' + error.message;
        }
    }
</script>
